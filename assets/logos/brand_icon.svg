  <path d="M9.5 16.5 L12 9.5" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" stroke-dasharray="1.5 1.5" />
  <path d="M30.5 16.5 L28 9.5" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" stroke-dasharray="1.5 1.5" />

