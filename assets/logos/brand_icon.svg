  <circle cx="20" cy="16.5" r="1.6" fill="#ffffff" />

  <!-- Apex Star of Discovery & Insight -->
  <path d="M20 3.8 L21 5.6 L22.8 6.5 L21 7.4 L20 9.2 L19 7.4 L17.2 6.5 L19 5.6 Z" fill="url(#ld-spark)" />
  <circle cx="20" cy="6.5" r="0.9" fill="#ffffff" />
