  <circle cx="9.5" cy="16.5" r="1.8" fill="#10b981" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="30.5" cy="16.5" r="1.8" fill="#10b981" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="12" cy="9.5" r="1.8" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
