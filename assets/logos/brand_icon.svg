  <path d="M20 21.5 C15.5 20.5 12 19 9.5 16.5" stroke="url(#ld-growth)" stroke-width="1.3" stroke-linecap="round" />
  <path d="M20 21.5 C24.5 20.5 28 19 30.5 16.5" stroke="url(#ld-growth)" stroke-width="1.3" stroke-linecap="round" />
  <path d="M20 16.5 C16 15 13.5 12.5 12 9.5" stroke="url(#ld-growth)" stroke-width="1.3" stroke-linecap="round" />
  <path d="M20 16.5 C24 15 26.5 12.5 28 9.5" stroke="url(#ld-growth)" stroke-width="1.3" stroke-linecap="round" />

